name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgpiod-dev \
          libopencv-dev \
          pkg-config
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --verbose
    
    - name: Check build artifacts
      run: |
        ls -lh build/
        echo "Checking for built binaries..."
        test -f build/test_simple || echo "Warning: test_simple not found"
        test -f build/libleptonLib.a || echo "Warning: libleptonLib.a not found"

  build-ubuntu-22:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgpiod-dev \
          libopencv-dev \
          pkg-config
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --verbose

  build-debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgpiod-dev \
          libopencv-dev \
          pkg-config

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake (Debug)
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_STANDARD=20

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --verbose

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install opencv cmake

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20

    - name: Build
      run: |
        cd build
        cmake --build . -j$(sysctl -n hw.ncpu)

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --verbose

    - name: Check build artifacts
      run: |
        ls -lh build/cdc_viewer/
        test -f build/cdc_viewer/readCDC_gui

  build-pico-firmware:
    runs-on: ubuntu-latest

    env:
      PICO_SDK_VERSION: "2.1.1"
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      FREERTOS_KERNEL_PATH: ${{ github.workspace }}/FreeRTOS-Kernel

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          python3

    - name: Install ARM toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: "13.2.Rel1"

    - name: Checkout Pico SDK
      uses: actions/checkout@v4
      with:
        repository: raspberrypi/pico-sdk
        ref: ${{ env.PICO_SDK_VERSION }}
        submodules: recursive
        path: pico-sdk

    - name: Checkout FreeRTOS-Kernel
      uses: actions/checkout@v4
      with:
        repository: FreeRTOS/FreeRTOS-Kernel
        submodules: recursive
        path: FreeRTOS-Kernel

    - name: Configure CMake
      run: |
        cmake -S pico/pico_lepton_cdc -B build-pico \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build-pico -j$(nproc)

    - name: Check build artifacts
      run: |
        ls -lh build-pico/*.uf2

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pico-firmware
        path: |
          build-pico/*.uf2
          build-pico/*.elf
